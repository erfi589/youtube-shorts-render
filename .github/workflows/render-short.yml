name: Render Short
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render job id
        required: true
        type: string
      release_id:
        description: Draft release that holds the job assets
        required: true
        type: string
      output_name:
        description: Name of the rendered asset in the release
        required: false
        default: output.mp4
        type: string
permissions:
  contents: write
concurrency:
  group: render-short
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB: ${{ inputs.job_id }}
      RID: ${{ inputs.release_id }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_NAME: ${{ inputs.output_name }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core jq
      - name: Download job assets from the private draft release
        run: |
          set -euo pipefail
          case "$RID" in *[!0-9]*|"") echo "Invalid release id"; exit 1;; esac
          mkdir -p work
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/$RID/assets?per_page=100" -o assets.json
          jq -r ".[] | [.id, .name] | @tsv" assets.json > list.tsv
          while read -r id name; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/$REPO/releases/assets/$id" -o "work/$name"
          done < list.tsv
          test -f work/manifest.json
      - name: Render video (one ffmpeg pass)
        working-directory: work
        run: |
          set -euo pipefail
          echo "$RENDER_PY" | base64 -d > render_short.py
          python3 render_short.py
          ls -la output.mp4
        env:
          RENDER_PY: 
      - name: Attach video to the private draft release (no git commit)
        run: |
          set -euo pipefail
          if [ -z "$OUT_NAME" ]; then OUT_NAME=output.mp4; fi
          case "$OUT_NAME" in *[!A-Za-z0-9._-]*|"") echo "Invalid output name"; exit 1;; esac
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: video/mp4" --data-binary @work/output.mp4 "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$OUT_NAME" -o /dev/null
