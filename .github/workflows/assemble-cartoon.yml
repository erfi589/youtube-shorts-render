name: Assemble Cartoon
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Cartoon job id
        required: true
        type: string
      release_id:
        description: Draft release that holds the verified clips and voice lines
        required: true
        type: string
      output_name:
        description: Name of the final MP4 asset in the release
        required: true
        type: string
      manifest_b64:
        description: Base64 assembly manifest (asset ids, sizes and SHA-256 of every input)
        required: true
        type: string
      interp:
        description: Frame-rate conversion (minterpolate or fps)
        required: false
        default: minterpolate
        type: string
permissions:
  contents: write
concurrency:
  group: assemble-cartoon
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RID: ${{ inputs.release_id }}
      OUT_NAME: ${{ inputs.output_name }}
      INTERP: ${{ inputs.interp }}
      MANIFEST_B64: ${{ inputs.manifest_b64 }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$RID" in *[!0-9]*|"") echo "Invalid release id"; exit 1;; esac
          case "$OUT_NAME" in *[!A-Za-z0-9._-]*|"") echo "Invalid output name"; exit 1;; esac
          case "$INTERP" in minterpolate|fps) ;; *) echo "Invalid interp"; exit 1;; esac
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/$RID" -o rel.json
          test "$(jq -r .draft rel.json)" = "true" || { echo "Release is not a draft"; exit 1; }
          if jq -e --arg n "$OUT_NAME" '.assets[] | select(.name == $n)' rel.json > /dev/null; then echo "$OUT_NAME already exists, refusing to overwrite"; exit 1; fi
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core python3-numpy jq
      - name: Download and verify inputs (size + SHA-256)
        run: |
          set -euo pipefail
          echo "$FETCH_PY" | base64 -d > fetch_inputs.py
          python3 fetch_inputs.py in
        env:
          FETCH_PY: 
      - name: Assemble cartoon
        run: |
          set -euo pipefail
          echo "$ASSEMBLE_PY" | base64 -d > assemble_cartoon.py
          mkdir -p out
          python3 assemble_cartoon.py --in in --out out/cartoon.mp4 --interp "$INTERP"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate:format=duration,size -of json out/cartoon.mp4
          sha256sum out/cartoon.mp4
        env:
          ASSEMBLE_PY: 
      - name: Attach final MP4 to the private draft release (no git commit)
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: video/mp4" --data-binary @out/cartoon.mp4 "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$OUT_NAME" -o /dev/null
